submission:
  title: "Semiconductor Yield Optimization with AI Root Cause Analysis"

  problem_statement: >
    At advanced chip nodes (3nm/5nm), a 1% yield drop costs $50–100M/month.
    Process engineers spend weeks manually correlating thousands of equipment
    sensors and defect reports to find root causes. This delays production
    recovery and costs millions per day.

  solution_summary: >
    We built an AI system using IBM Bob to analyze wafer sensor data, identify
    patterns, rank probable root causes via SHAP explanations, and predict
    which upcoming batches will fail before manufacturing. Pressure drift is
    the #1 failure predictor (r=0.87), enabling targeted corrective actions.

  key_features:
    - "Real-time anomaly detection from equipment sensor time-series"
    - "Machine learning failure prediction with SHAP explanations"
    - "Root cause ranking via feature importance + lot similarity matching"
    - "Batch risk scoring for upcoming production runs"
    - "Equipment performance analysis and degradation tracking"

  tech_stack:
    languages: ["Python"]
    frameworks: ["scikit-learn", "pandas"]
    ibm_technologies: ["IBM Bob"]
    databases: ["CSV data sources"]
    other: ["SHAP", "numpy", "matplotlib"]

  what_we_are_most_proud_of: >
    We identified pressure drift as the #1 yield predictor (r=0.87 correlation
    with failures) and built a production-ready root cause analyzer that ranks
    probable causes with SHAP feature importance scoring. The system catches
    equipment degradation patterns automatically.

  known_limitations: >
    Dataset spans 2 months (Jan–Feb 2024) — limited for seasonal patterns.
    SHAP explanations currently text-based (could add visualizations).
    No predictive maintenance scheduling (ranked causes only).
    Batch scoring uses historical recipe stats as proxy (not real physics model).

